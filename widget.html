<!-- Chatbot Widget - Isko apni website me paste karo -->
<style>
#chat-btn{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:30px;cursor:pointer;z-index:9999}
#chat-box{display:none;position:fixed;bottom:90px;right:20px;width:300px;height:400px;background:#fff;border:1px solid #ccc;border-radius:10px;flex-direction:column;z-index:9999}
#chat-msgs{flex:1;overflow:auto;padding:10px;font-family:sans-serif;font-size:14px}
#chat-input{display:flex;border-top:1px solid #ccc}
#chat-input input{flex:1;border:none;padding:10px;outline:none}
#chat-input button{border:none;background:#25D366;color:#fff;padding:10px 15px;cursor:pointer}
</style>

<button id="chat-btn" onclick="toggleChat()">💬</button>
<div id="chat-box">
  <div id="chat-msgs"></div>
  <div id="chat-input">
    <input id="msg" placeholder="Sawal likhen...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
const API_URL = "chat-i7r1eq1ve-ali-ed6c.vercel.app"; // Yahan apna Render link dalna hai

function toggleChat(){
  let b=document.getElementById('chat-box');
  b.style.display = b.style.display=='flex' ? 'none' : 'flex';
}
async function sendMsg(){
  let input=document.getElementById('msg');
  let msgs=document.getElementById('chat-msgs');
  if(!input.value) return;
  msgs.innerHTML+=`<div><b>You:</b> ${input.value}</div>`;
  let userText=input.value;
  input.value='';
  let res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:userText})});
  let data=await res.json();
  msgs.innerHTML+=`<div><b>Bot:</b> ${data.reply}</div>`;
  msgs.scrollTop=msgs.scrollHeight;
}
</script>
